name: Tests

on:
  push:
    branches:
      - '**'
      - '!master'
    tags-ignore:
      - '**'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest --cov=valifold || [ $? -eq 5 ]

      - name: Lint
        run: ruff check

      - name: Type check
        run: mypy --install-types --non-interactive src/; mypy src/

      - name: Upload coverage to Coveralls
        run: |
          pip install coveralls -q
          coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
