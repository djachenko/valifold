[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valifold"
version = "0.2.3"
authors = [
    { name = "Igor Djachenko" },
]
description = "A Python library for validating file and folder structures with a fluent DSL"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Typing :: Typed"
]
license = "MIT"

[project.urls]
homepage = "https://github.com/djachenko/valifold"
source = "https://github.com/djachenko/valifold"
documentation = "https://github.com/djachenko/valifold#readme"
issues = "https://github.com/djachenko/valifold/issues"


[project.optional-dependencies]
test = [
    "pytest >= 9.0",
    "ruff >= 0.15",
    "mypy >= 1.19",
    "pytest-cov >= 7.0",
]
release = [
    "python-semantic-release >= 9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/valifold"]

[tool.pytest]
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow",
    "edge_case: marks tests as edge cases tests"
]
addopts = [
    "-m", "not slow"
]

[tool.mypy]
strict = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"